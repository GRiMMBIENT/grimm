<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GR!MM Pattern Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; background: #0b0b0a; font-family: 'Press Start 2P', monospace; color: #b8b4a9; position: relative; overflow: hidden; box-sizing: border-box">
<div style="position: absolute; left: 0; top: 0; width: 480px; height: 48px; display: flex; gap: 6px; padding: 6px; box-sizing: border-box">
<div style="background: {{accent}}; color: #0b0b0a; font-size: 16px; display: flex; align-items: center; padding: 0 10px">SEQ</div>
<div style="background: #26251f; flex-grow: 1; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span>PATTERN A</span><span style="color: #5e5b54">2/2</span></div>
</div>
<div style="position: absolute; left: 24px; top: 62px; font-size: 8px; color: #5e5b54">PATTERNS (SEL + PRESETS = NEXT)</div>
<div style="position: absolute; left: 24px; top: 80px; width: 432px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{pats}}" as="pt" hint-placeholder-count="4">
<div style="height: 56px; box-sizing: border-box; background: {{pt.bg}}; color: {{pt.fg}}; border: {{pt.border}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<div style="font-size: 20px">{{pt.name}}</div>
<div style="font-size: 8px">{{pt.tag}}</div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 24px; top: 150px; width: 432px; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="height: 34px; background: {{r.bg}}; color: {{r.fg}}; font-size: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
<span>{{r.k}}</span><span>{{r.v}}</span>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 6px; top: 330px; width: 468px; height: 144px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{slabs}}" as="s" hint-placeholder-count="4">
<div style="background: #26251f; padding: 10px 8px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box">
<div style="font-size: 12px">{{s.label}}</div>
<div style="display: flex; gap: 2px">
<sc-for list="{{s.segs}}" as="g" hint-placeholder-count="8">
<div style="flex-grow: 1; height: 28px; background: {{g.col}}"></div>
</sc-for>
</div>
<div style="font-size: 20px">{{s.val}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8321e","options":["#c8321e","#d08a1c","#2f8f8a","#7a4fb0"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.accent ?? '#c8321e';
    const P = { k: '#0b0b0a', d: '#26251f', m: '#5e5b54', l: '#b8b4a9' };
    const pats = [
      { name: 'A', tag: 'PLAYING', bg: A, fg: P.k, border: 'none' },
      { name: 'B', tag: 'NEXT', bg: P.k, fg: P.l, border: '3px solid ' + P.l },
      { name: 'C', tag: '32 ST', bg: P.d, fg: P.l, border: 'none' },
      { name: 'D', tag: 'EMPTY', bg: P.d, fg: P.m, border: 'none' }
    ];
    const rows = [
      { k: 'TIME MULT', v: 'X4', sel: true }, { k: 'FOLLOW SONG', v: 'ON' },
      { k: 'COPY TO', v: 'C' }, { k: 'CLEAR', v: 'HOLD' }
    ].map((r) => ({ k: r.k, v: r.v, bg: r.sel ? P.l : P.d, fg: r.sel ? P.k : P.l }));
    const vals = [['STEPS', '48', 6], ['DIV', '1/16', 2], ['SWING', '012', 1], ['PLAY', 'FWD', 1]];
    const slabs = vals.map((v) => ({ label: v[0], val: v[1], segs: Array.from({ length: 8 }, (_, j) => ({ col: j < v[2] ? P.l : P.k })) }));
    return { accent: A, pats, rows, slabs };
  }
}
</script>
</body>
</html>
