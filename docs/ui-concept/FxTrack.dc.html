<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GR!MM Track FX</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; background: #0b0b0a; font-family: 'Press Start 2P', monospace; color: #b8b4a9; position: relative; overflow: hidden; box-sizing: border-box">
<div style="position: absolute; left: 0; top: 0; width: 480px; height: 48px; display: flex; gap: 6px; padding: 6px; box-sizing: border-box">
<div style="background: {{accent}}; color: #0b0b0a; font-size: 16px; display: flex; align-items: center; padding: 0 10px">FX</div>
<div style="background: #26251f; flex-grow: 1; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span>T1 VA</span><span style="color: #5e5b54">1/2</span></div>
</div>
<div style="position: absolute; left: 24px; top: 66px; width: 432px; display: flex; align-items: center; justify-content: space-between">
<div style="width: 112px; height: 48px; background: #26251f; font-size: 12px; display: flex; align-items: center; justify-content: center">DRIVE</div>
<div style="font-size: 16px; color: #5e5b54">&gt;</div>
<div style="width: 112px; height: 48px; background: #26251f; font-size: 12px; display: flex; align-items: center; justify-content: center">FILTER</div>
<div style="font-size: 16px; color: #5e5b54">&gt;</div>
<div style="width: 112px; height: 48px; background: #26251f; font-size: 12px; display: flex; align-items: center; justify-content: center">SENDS</div>
</div>
<div style="position: absolute; left: 24px; top: 134px; width: 432px; display: flex; justify-content: space-evenly; align-items: flex-end">
<sc-for list="{{sends}}" as="sd" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 56px; display: flex; flex-direction: column; gap: 3px">
<sc-for list="{{sd.blocks}}" as="b" hint-placeholder-count="8">
<div style="width: 56px; height: 14px; background: {{b.c}}"></div>
</sc-for>
</div>
<div style="font-size: 8px; color: #5e5b54">{{sd.name}}</div>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 112px; height: 136px; box-sizing: border-box; border: 3px solid #5e5b54; font-size: 12px; display: flex; align-items: center; justify-content: center">SPACE</div>
<div style="font-size: 8px; color: #5e5b54">SHARED</div>
</div>
</div>
<div style="position: absolute; left: 6px; top: 330px; width: 468px; height: 144px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{slabs}}" as="s" hint-placeholder-count="4">
<div style="background: #26251f; padding: 10px 8px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box">
<div style="font-size: 12px">{{s.label}}</div>
<div style="display: flex; gap: 2px">
<sc-for list="{{s.segs}}" as="g" hint-placeholder-count="8">
<div style="flex-grow: 1; height: 28px; background: {{g.col}}"></div>
</sc-for>
</div>
<div style="font-size: 20px">{{s.val}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8321e","options":["#c8321e","#d08a1c","#2f8f8a","#7a4fb0"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.accent ?? '#c8321e';
    const P = { k: '#0b0b0a', d: '#26251f', m: '#5e5b54', l: '#b8b4a9' };
    const meter = (n) => Array.from({ length: 8 }, (_, i) => ({ c: 7 - i < n ? P.l : P.d }));
    const sends = [{ name: 'DLY 040', blocks: meter(3) }, { name: 'REV 080', blocks: meter(6) }];
    const vals = [['DRIVE', '035', 3], ['TONE', '060', 5], ['DLY', '040', 3], ['REV', '080', 6]];
    const slabs = vals.map((v) => ({ label: v[0], val: v[1], segs: Array.from({ length: 8 }, (_, j) => ({ col: j < v[2] ? P.l : P.k })) }));
    return { accent: A, sends, slabs };
  }
}
</script>
</body>
</html>
