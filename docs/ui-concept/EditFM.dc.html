<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GR!MM Edit FM</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; background: #0b0b0a; font-family: 'Press Start 2P', monospace; color: #b8b4a9; position: relative; overflow: hidden; box-sizing: border-box">
<div style="position: absolute; left: 0; top: 0; width: 480px; height: 48px; display: flex; gap: 6px; padding: 6px; box-sizing: border-box">
<div style="background: {{accent}}; color: #0b0b0a; font-size: 16px; display: flex; align-items: center; padding: 0 10px">EDIT</div>
<div style="background: #26251f; flex-grow: 1; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span>T2 FM</span><span style="color: #5e5b54">1/4</span></div>
</div>
<div style="position: absolute; left: 24px; top: 62px; width: 432px; display: flex; justify-content: space-between; font-size: 8px; color: #5e5b54"><span>ALGORITHM 05</span><span>FB ON OP6</span></div>
<div style="position: absolute; left: 24px; top: 88px; width: 432px; display: flex; justify-content: space-around">
<sc-for list="{{stacks}}" as="st" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center">
<div style="width: 72px; height: 40px; background: #26251f; font-size: 16px; display: flex; align-items: center; justify-content: center">{{st.mod}}</div>
<div style="width: 6px; height: 56px; background: #5e5b54"></div>
<div style="width: 72px; height: 40px; box-sizing: border-box; border: 3px solid {{accent}}; font-size: 16px; color: {{accent}}; display: flex; align-items: center; justify-content: center">{{st.car}}</div>
<div style="width: 6px; height: 20px; background: #b8b4a9"></div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 93px; top: 244px; width: 294px; height: 6px; background: #b8b4a9"></div>
<div style="position: absolute; left: 0; top: 262px; width: 480px; text-align: center; font-size: 8px; color: #5e5b54">OUT</div>
<div style="position: absolute; left: 24px; top: 290px; width: 432px; display: flex; gap: 18px; font-size: 8px; color: #5e5b54">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #26251f"></span>MODULATOR</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; box-sizing: border-box; border: 2px solid {{accent}}"></span>CARRIER</span>
</div>
<div style="position: absolute; left: 6px; top: 330px; width: 468px; height: 144px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{slabs}}" as="s" hint-placeholder-count="4">
<div style="background: #26251f; padding: 10px 8px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box">
<div style="font-size: 12px">{{s.label}}</div>
<div style="display: flex; gap: 2px">
<sc-for list="{{s.segs}}" as="g" hint-placeholder-count="8">
<div style="flex-grow: 1; height: 28px; background: {{g.col}}"></div>
</sc-for>
</div>
<div style="font-size: 20px">{{s.val}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8321e","options":["#c8321e","#d08a1c","#2f8f8a","#7a4fb0"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.accent ?? '#c8321e';
    const P = { k: '#0b0b0a', l: '#b8b4a9' };
    const stacks = [{ mod: '2', car: '1' }, { mod: '4', car: '3' }, { mod: '6', car: '5' }];
    const vals = [['ALGO', '05', 2], ['RATIO', '2.00', 3], ['FBK', '3', 3], ['LEVEL', '090', 7]];
    const slabs = vals.map((v) => ({ label: v[0], val: v[1], segs: Array.from({ length: 8 }, (_, j) => ({ col: j < v[2] ? P.l : P.k })) }));
    return { accent: A, stacks, slabs };
  }
}
</script>
</body>
</html>
