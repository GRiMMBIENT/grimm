<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GR!MM Space</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; background: #0b0b0a; font-family: 'Press Start 2P', monospace; color: #b8b4a9; position: relative; overflow: hidden; box-sizing: border-box">
<div style="position: absolute; left: 0; top: 0; width: 480px; height: 48px; display: flex; gap: 6px; padding: 6px; box-sizing: border-box">
<div style="background: {{accent}}; color: #0b0b0a; font-size: 16px; display: flex; align-items: center; padding: 0 10px">FX</div>
<div style="background: #26251f; flex-grow: 1; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span>SPACE</span><span style="color: #5e5b54">2/2</span></div>
</div>
<div style="position: absolute; left: 18px; top: 66px; font-size: 8px; color: #5e5b54">DELAY</div>
<div style="position: absolute; left: 18px; top: 84px; width: 444px; height: 48px; display: flex; align-items: flex-end; gap: 12px">
<sc-for list="{{echoes}}" as="e" hint-placeholder-count="7">
<div style="width: {{e.size}}px; height: {{e.size}}px; background: {{e.col}}"></div>
</sc-for>
</div>
<div style="position: absolute; left: 18px; top: 150px; font-size: 8px; color: #5e5b54">REVERB</div>
<div style="position: absolute; left: 18px; top: 168px; width: 444px; height: 144px; display: flex; align-items: flex-end; gap: 6px">
<sc-for list="{{tail}}" as="b" hint-placeholder-count="37">
<div style="width: 6px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{b.px}}" as="p" hint-placeholder-count="6">
<div style="width: 6px; height: 6px; background: {{p.col}}"></div>
</sc-for>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 360px; top: 62px; background: {{accent}}; color: #0b0b0a; font-size: 8px; padding: 6px 8px">FREEZE</div>
<div style="position: absolute; left: 6px; top: 330px; width: 468px; height: 144px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{slabs}}" as="s" hint-placeholder-count="4">
<div style="background: #26251f; padding: 10px 8px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box">
<div style="font-size: 12px">{{s.label}}</div>
<div style="display: flex; gap: 2px">
<sc-for list="{{s.segs}}" as="g" hint-placeholder-count="8">
<div style="flex-grow: 1; height: 28px; background: {{g.col}}"></div>
</sc-for>
</div>
<div style="font-size: 20px">{{s.val}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8321e","options":["#c8321e","#d08a1c","#2f8f8a","#7a4fb0"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.accent ?? '#c8321e';
    const P = { k: '#0b0b0a', d: '#26251f', m: '#5e5b54', l: '#b8b4a9' };
    const echoes = [48, 40, 34, 28, 22, 16, 10].map((size, i) => ({ size, col: i < 2 ? P.l : (i < 4 ? P.m : P.d) }));
    const tail = Array.from({ length: 37 }, (_, i) => {
      const h = Math.max(1, Math.round(18 * Math.exp(-i / 13) + ((i * 7) % 3) - 1));
      return { px: Array.from({ length: h }, (_, j) => ({ col: j === 0 ? P.l : (j < h / 2 ? P.m : P.d) })) };
    });
    const vals = [
      { label: 'TIME', val: '1/4D', f: 5 }, { label: 'FDBK', val: '070', f: 6 },
      { label: 'SIZE', val: 'INF', f: 8 }, { label: 'MIX', val: '045', f: 4 }
    ];
    const slabs = vals.map((v) => ({ label: v.label, val: v.val, segs: Array.from({ length: 8 }, (_, j) => ({ col: j < v.f ? P.l : P.k })) }));
    return { accent: A, echoes, tail, slabs };
  }
}
</script>
</body>
</html>
