<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GR!MM Scale and Chord</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; background: #0b0b0a; font-family: 'Press Start 2P', monospace; color: #b8b4a9; position: relative; overflow: hidden; box-sizing: border-box">
<div style="position: absolute; left: 0; top: 0; width: 480px; height: 48px; display: flex; gap: 6px; padding: 6px; box-sizing: border-box">
<div style="background: {{accent}}; color: #0b0b0a; font-size: 16px; display: flex; align-items: center; padding: 0 10px">SEL</div>
<div style="background: #26251f; flex-grow: 1; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span>CHORD ON</span><span style="color: #5e5b54">T1</span></div>
</div>
<div style="position: absolute; left: 24px; top: 62px; width: 432px; display: flex; justify-content: space-between; font-size: 8px; color: #5e5b54"><span>C NATURAL MINOR</span><span>F3 - G5</span></div>
<div style="position: absolute; left: 24px; top: 84px; width: 432px; height: 144px">
<div style="display: flex; gap: 2px">
<sc-for list="{{whites}}" as="wk" hint-placeholder-count="16">
<div style="width: 25px; height: 144px; background: {{wk.c}}"></div>
</sc-for>
</div>
<sc-for list="{{blacks}}" as="bk" hint-placeholder-count="11">
<div style="position: absolute; left: {{bk.left}}px; top: 0; width: 17px; height: 86px; background: {{bk.c}}; box-sizing: border-box; border: 2px solid #0b0b0a"></div>
</sc-for>
</div>
<div style="position: absolute; left: 24px; top: 248px; display: flex; align-items: baseline; gap: 16px">
<div style="font-size: 24px; color: {{accent}}">Cm7</div>
<div style="font-size: 8px; color: #5e5b54">1 KEY = 4 NOTES IN KEY</div>
</div>
<div style="position: absolute; left: 24px; top: 290px; display: flex; gap: 18px; font-size: 8px; color: #5e5b54">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #b8b4a9"></span>IN SCALE</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: {{accent}}"></span>CHORD</span>
</div>
<div style="position: absolute; left: 6px; top: 330px; width: 468px; height: 144px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{slabs}}" as="s" hint-placeholder-count="4">
<div style="background: #26251f; padding: 10px 8px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box">
<div style="font-size: 12px">{{s.label}}</div>
<div style="display: flex; gap: 2px">
<sc-for list="{{s.segs}}" as="g" hint-placeholder-count="8">
<div style="flex-grow: 1; height: 28px; background: {{g.col}}"></div>
</sc-for>
</div>
<div style="font-size: 20px">{{s.val}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8321e","options":["#c8321e","#d08a1c","#2f8f8a","#7a4fb0"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.accent ?? '#c8321e';
    const P = { k: '#0b0b0a', d: '#26251f', m: '#5e5b54', l: '#b8b4a9' };
    const letters = 'FGABCDEFGABCDEFG'.split('');
    const inScaleW = { C: true, D: true, F: true, G: true };
    const chordW = { 4: true, 8: true };
    const whites = letters.map((L, i) => ({ c: chordW[i] ? A : (inScaleW[L] ? P.l : P.m) }));
    const inScaleB = { D: true, G: true, A: true };
    const chordB = { 5: true, 9: true };
    const blacks = [];
    letters.forEach((L, i) => {
      if (i < 15 && 'FGACD'.includes(L)) blacks.push({ left: (i + 1) * 27 - 10, c: chordB[i] ? A : (inScaleB[L] ? P.m : P.d) });
    });
    const vals = [['ROOT', 'C', 1], ['SCALE', 'MIN', 2], ['CHORD', '7TH', 3], ['VOICE', 'DRP2', 2]];
    const slabs = vals.map((v) => ({ label: v[0], val: v[1], segs: Array.from({ length: 8 }, (_, j) => ({ col: j < v[2] ? P.l : P.k })) }));
    return { accent: A, whites, blacks, slabs };
  }
}
</script>
</body>
</html>
