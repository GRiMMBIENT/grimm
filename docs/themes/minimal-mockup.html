function build(GLOW){
const glow = GLOW;
const BG = '#000000', K = '#d6d6d2', R = '#e39b2d', W = '#f0f0ec', C1 = '#1e2023', C2 = '#222528', C3 = '#26292d', D = '#6a6e73', S = '#34383c', SEL = '#2c2f33';
const tsInk = glow ? '0 0 5px rgba(214,214,210,0.55)' : 'none', tsDim = glow ? '0 0 5px rgba(124,128,134,0.45)' : 'none', tsAcc = glow ? '0 0 6px rgba(227,155,45,0.75)' : 'none';
let seed = 5;
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
const sz = (s) => s >= 40 ? Math.round(s * 0.6) : s >= 26 ? Math.round(s * 0.75) : s;
const mk = () => {
const g = { r: [], p: [], q: [] };
g.rect = (x, y, w, h, f) => g.r.push({ x, y, w, h, f });
g.path = (d, w, c) => g.p.push({ d, w: w || 3, c: c || K });
g.text = (x, y, t, s, c, light, a) => g.q.push({ x, y, t, s: sz(s), c: c || K, wt: light ? 400 : 500, a: a || 'start' });

return g;
};
const fn = (f, a, b, yc, amp) => { let d = ''; for (let i = 0; i <= 107; i++) { const t = i / 107, x = a + t * (b - a); d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + (yc - f(t) * amp).toFixed(1); } return d; };

const g = mk();
g.text(4, 30, label, 18);
const wx = (i) => 4 + i * 66;
for (let i = 0; i < 7; i++) g.rect(wx(i), 56, 62, 250, C3);
[0, 1, 3, 4, 5].forEach((i) => g.rect(wx(i) + 42, 56, 42, 150, '#4a4e53'));

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){

  return `<div><div class="lab">${esc(pg.label)}</div><div class="scr"><div class="hdr"><div style="font-size:18px;font-weight:500;letter-spacing:2px;text-shadow:${tsInk}">${esc(pg.title)}</div><div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:11px;letter-spacing:1px;color:#7c8086;text-shadow:${tsDim}">${esc(pg.tagL)}</span><span style="font-size:18px;font-weight:500;text-shadow:${tsInk}">${esc(pg.tagV)}</span></div></div><svg width="448" height="306" viewBox="0 0 468 320" style="display:block;flex-shrink:0;margin:8px 0">${filt}<rect x="0" y="0" width="468" height="320" fill="#000"/><g filter="${glow?'url(#glow)':'none'}">${svg}</g></svg><div class="knobs">${kn}</div></div></div>`;
 }).join('');
}
